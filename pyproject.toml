[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audivra"
dynamic = ["version"]
description = "Audit trail and audit log for Django."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "audivra contributors" }]
keywords = ["django", "audit", "audit-log", "audit-trail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2,<6.2",
]

[project.optional-dependencies]
celery = ["celery>=5.3"]
dev = [
    "build>=1.2",
    "coverage>=7",
    "django-stubs>=5.2",
    "mypy>=1.13",
    "pre-commit>=4",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-django>=4.9",
    "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/audivra/audivra"
Changelog = "https://github.com/audivra/audivra/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/audivra/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/audivra"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["audivra"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["audivra"]
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.django-stubs]
django_settings_module = "tests.django_settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "postgres: tests that require PostgreSQL",
]

[tool.coverage.run]
source = ["audivra"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
